<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marketplace – Browse products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar"><h1>Marketplace</h1></header>

  <div class="layout">
    <!-- LEFT: sticky filter sidebar -->
    <aside class="sidebar" aria-label="Product filters">
      <div class="sidebar-head">
        <h2>Filters</h2>
        <button type="button" id="resetBtn" class="link-btn">Reset all</button>
      </div>

      <fieldset class="group">
        <legend>Category</legend>
        <div id="categoryList"></div>
      </fieldset>

      <fieldset class="group">
        <legend>Price range</legend>
        <div class="price-values"><output id="minOut"></output><output id="maxOut"></output></div>
        <div class="range" id="range">
          <div class="range-track"><div class="range-fill" id="rangeFill"></div></div>
          <input type="range" id="minPrice" aria-label="Minimum price" />
          <input type="range" id="maxPrice" aria-label="Maximum price" />
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Minimum rating</legend>
        <div id="ratingList"></div>
      </fieldset>
    </aside>

    <!-- RIGHT: product grid -->
    <main class="content">
      <div class="toolbar">
        <p id="resultCount" class="count" aria-live="polite"></p>
        <label class="sort">
          <span>Sort by</span>
          <select id="sortSelect"></select>
        </label>
      </div>

      <section id="grid" class="grid" aria-live="polite"></section>

      <section id="empty" class="empty" hidden>
        <p class="empty-title">No items match your criteria.</p>
        <p class="empty-sub">Try widening the price range or removing a filter.</p>
        <button type="button" id="emptyReset" class="primary-btn">Reset filters</button>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
